<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Фигура в тумане">
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0"    stop-color="#e4e6e9"/>
      <stop offset="0.34" stop-color="#eaecee"/>
      <stop offset="0.62" stop-color="#eef0f1"/>
      <stop offset="1"    stop-color="#dcdfe3"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0"    stop-color="#ffd15c"/>
      <stop offset="0.22" stop-color="#ff9b12"/>
      <stop offset="0.6"  stop-color="#ff5a00"/>
      <stop offset="1"    stop-color="#c02a00"/>
    </linearGradient>
    <linearGradient id="coatLight" x1="0" y1="0" x2="0.08" y2="1">
      <stop offset="0"    stop-color="#8b9199" stop-opacity="0.42"/>
      <stop offset="0.28" stop-color="#5c626a" stop-opacity="0.2"/>
      <stop offset="0.62" stop-color="#2a2f35" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#15181c" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1"    stop-color="#000000"/>
    </radialGradient>
    <mask id="vign" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="1000">
      <rect width="800" height="1000" fill="url(#vig)"/>
    </mask>

    <filter id="dof"   x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="dof2"  x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="mist"  x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="46"/></filter>

    <path id="body" d="M 400 148
      C 296 148 236 232 234 334
      C 232 424 248 486 262 524
      C 176 566 116 648 92 770
      C 68 886 60 952 58 1002
      L 742 1002
      C 740 952 732 886 708 770
      C 684 648 624 566 538 524
      C 552 486 568 424 566 334
      C 564 232 504 148 400 148 Z"/>
    <path id="goggles" d="M 312 330
      C 312 316 326 308 342 308
      L 458 308
      C 474 308 488 316 488 330
      C 490 384 474 428 454 450
      C 440 464 422 460 413 442
      C 405 424 395 424 387 442
      C 378 460 360 464 346 450
      C 326 428 310 384 312 330 Z"/>

    <style>
      @keyframes visorPulse{0%,100%{opacity:.72}50%{opacity:1}}
      @keyframes visorGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.06)}}
      .v-core{animation:visorPulse 5.5s ease-in-out infinite}
      .v-glow{animation:visorGlow 5.5s ease-in-out infinite;transform-origin:400px 380px}
      @media (prefers-reduced-motion:reduce){.v-core,.v-glow{animation:none}}
    </style>
  </defs>

  <g mask="url(#vign)">
  <rect width="800" height="1000" fill="url(#fog)"/>
  <rect width="800" height="1000" fill="url(#haze)"/>

  <!-- дальний туман -->
  <g filter="url(#mist)" opacity="0.75">
    <ellipse cx="140" cy="700" rx="260" ry="120" fill="#ffffff"/>
    <ellipse cx="690" cy="760" rx="240" ry="110" fill="#ffffff"/>
    <ellipse cx="400" cy="250" rx="330" ry="150" fill="#f4f5f6"/>
  </g>

  <!-- фигура -->
  <g filter="url(#dof)">
    <use href="#body" fill="#15171a"/>
    <use href="#body" fill="url(#coatLight)"/>
    <!-- складка капюшона -->
    <path d="M 300 250 C 330 206 380 190 424 198" stroke="#6b7178" stroke-opacity="0.35" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 268 520 C 340 556 468 556 536 520" stroke="#000000" stroke-opacity="0.55" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>

  <!-- свечение очков -->
  <g filter="url(#bloom)" class="v-glow" style="mix-blend-mode:screen">
    <use href="#goggles" fill="#ff6a00"/>
  </g>

  <!-- очки -->
  <g filter="url(#dof2)" class="v-core">
    <use href="#goggles" fill="url(#visor)"/>
    <path d="M 352 330 C 352 322 360 318 370 318 L 430 318 C 440 318 448 322 448 330 C 450 366 440 396 428 410 C 420 418 410 414 404 404 L 396 404 C 390 414 380 418 372 410 C 360 396 350 366 352 330 Z"
          fill="#ffd98a" opacity="0.7"/>
  </g>

  <!-- пелена поверх кадра -->
  <rect width="800" height="1000" fill="#ffffff" opacity="0.06"/>
  </g>
</svg>
